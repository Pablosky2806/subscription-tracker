spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/subscription_tracker}
    username: ${SPRING_DATASOURCE_USERNAME:subscription_user}
    password: ${SPRING_DATASOURCE_PASSWORD:local-dev-change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
